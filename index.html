<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d1111" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <title>vzlmr</title>
    <meta
      name="description"
      content="City, sky and street photography from Kuala Lumpur. Commissions, editorial work and prints."
    />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="vzlmr — Photography by Faizal Amri" />
    <meta
      property="og:description"
      content="City, sky and street photography from Kuala Lumpur."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- The hero's key frame (the photo flagged `hero` in src/data/photos.js) is the
         largest paint. The page renders from JS, so without this the browser only
         finds the image after the bundle runs. Keep it in step with the manifest. -->
    <link
      rel="preload"
      as="image"
      href="/photos/jalur-gemilang-1366.webp"
      imagesrcset="/photos/jalur-gemilang-480.webp 480w, /photos/jalur-gemilang-960.webp 960w, /photos/jalur-gemilang-1366.webp 1366w"
      imagesizes="100vw"
      fetchpriority="high"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=League+Gothic&family=TASA+Orbiter:wght@400..800&family=Geist+Mono:wght@400..600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
