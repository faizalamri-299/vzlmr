<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- vzlmr mark. The V is a path, not text: favicons don't load the League
       Gothic webfont, so a text element would fall back to whatever the browser
       has and change shape per platform. Gradient walks the site's own hue-1 to
       hue-5 spectrum (see the tokens at the top of src/index.css).
       Note: no double hyphens in this comment, XML forbids them. -->
  <defs>
    <linearGradient id="v" x1="5" y1="5" x2="27" y2="27" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff0088"/>
      <stop offset=".5" stop-color="#9911ff"/>
      <stop offset="1" stop-color="#0cdcf7"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="#0d1111"/>
  <path fill="url(#v)" d="M5.55 5.55h5.94L16 17.54l4.51-11.99h5.94L18.97 26.45h-5.94z"/>
</svg>
